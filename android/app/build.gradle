plugins {
    id 'com.android.application'
    // 全 Compose 原生重写（v5.0.0 起）
    id 'org.jetbrains.kotlin.android'
}

// ─────────────────────────────────────────────────────────────
// 发布签名（v4.6.0 起）
// keystore.properties 内含口令，**不入库**；模板见 android/keystore/keystore.properties.example
// 未提供时自动退回 debug 签名（仅本地调试可用，绝不可作为分发件）
// ─────────────────────────────────────────────────────────────
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseSigning = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    hasReleaseSigning = keystoreProps.containsKey('storeFile')
}

android {
    namespace 'cn.cinemavault.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.cinemavault.app"
        minSdk 24
        targetSdk 34
        // ⚠ 版本号唯一可信来源：此处的 versionCode / versionName。
        //   服务端 routes/app-update.js 会解析本文件，原生侧读 BuildConfig，前端读 /api/app/android-version。
        // v5.2.0：小说翻页改造 + 脱离PC的公网更新(国内镜像)
        versionCode 7
        versionName "5.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 公网更新源（非凭据，URL 常量）：手机不连 PC 时从这里检查/下载更新。
        // GitHub API 与 Release 直链经国内镜像前缀加速；镜像不可达时自动回退原站。
        buildConfigField "String", "PUBLIC_REPO", '"INORIergai/local-acgn-app"'
        buildConfigField "String", "PUBLIC_VERSION_JSON", '"https://raw.githubusercontent.com/INORIergai/local-acgn-app/main/android-version-public.json"'
        buildConfigField "String", "PUBLIC_MIRRORS", '"https://gh-proxy.com/,https://ghfast.top/,https://github.moeyy.xyz/"'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 明确标注：debug 构建仅为本地调试
            applicationIdSuffix ""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        // 原生侧用 BuildConfig.VERSION_NAME 取版本，避免手写字符串漂移
        buildConfig true
        // 全 Compose 原生重写
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // ── Compose（全原生重写 v5）──
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 扫码连接：纯 Java + 离线，不依赖 Google Play Services（华为设备可用）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ── 原生播放（看番 + TTS 听书）──
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ── 旧 WebView 依赖（v5 过渡期保留，入口切换后移除）──
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.0'
}
