<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午夜场 · Cinema Vault</title>
    <style>
        :root {
            --bg: #131110;
            --bg-elevated: #1C1915;
            --text: #EFE9DC;
            --text-muted: #9C9282;
            --border: #2E2820;
            --primary: #E5A63C;
            --font-display: Georgia, "Times New Roman", "STZhongsong", "SimSun", serif;
            --font-body: "Segoe UI", "Microsoft YaHei", sans-serif;
            --font-mono: "Cascadia Mono", Consolas, monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 115%, rgba(229, 166, 60, 0.1), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 46px;
        }

        .marquee {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .bulb {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px 2px rgba(229, 166, 60, 0.65);
            animation: pulse 2.8s ease-in-out infinite;
        }
        .bulb:nth-child(2) { animation-delay: .25s; }
        .bulb:nth-child(3) { animation-delay: .5s; }
        .bulb:nth-child(4) { animation-delay: .75s; }
        .bulb:nth-child(5) { animation-delay: 1s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(30px, 5vw, 44px);
            margin: 0 0 8px;
            letter-spacing: 0.06em;
        }

        .sub {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* 四个放映厅的门 */
        .halls {
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 200px));
            gap: 18px;
            width: 100%;
            max-width: 920px;
        }

        @media (max-width: 800px) {
            .halls { grid-template-columns: repeat(2, 1fr); }
        }

        a.hall {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 34px 18px 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        a.hall:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 18px 44px -16px rgba(0, 0, 0, 0.7);
        }

        /* 门楣上的小齿孔灯带 */
        a.hall::before {
            content: '';
            width: 72%;
            height: 8px;
            background-color: #0C0B09;
            background-image: radial-gradient(circle at 50% 50%, var(--primary) 1.8px, transparent 2.4px);
            background-size: 12px 8px;
            background-position: center;
            border-radius: 4px;
            opacity: 0.75;
        }

        .hall-icon { font-size: 38px; }

        .hall-name {
            font-family: var(--font-display);
            font-size: 19px;
            letter-spacing: 0.08em;
        }

        .hall-en {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        footer {
            margin-top: 52px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.2em;
            color: var(--text-muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .bulb { animation: none; }
            a.hall { transition: none; }
        }
    </style>
</head>

<body>
    <header>
        <div class="marquee">
            <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        </div>
        <h1>午夜场</h1>
        <div class="sub">CINEMA VAULT — PRIVATE SCREENING</div>
    </header>

    <main class="halls">
        <a class="hall" href="/library.html?type=jav">
            <span class="hall-icon">🎞️</span>
            <span class="hall-name">影片馆</span>
            <span class="hall-en">Feature Films</span>
        </a>
        <a class="hall" href="/library.html?type=anime">
            <span class="hall-icon">🎌</span>
            <span class="hall-name">动漫馆</span>
            <span class="hall-en">Animation</span>
        </a>
        <a class="hall" href="/library.html?type=comic">
            <span class="hall-icon">📚</span>
            <span class="hall-name">漫画馆</span>
            <span class="hall-en">Comics</span>
        </a>
        <a class="hall" href="/library.html?type=novel">
            <span class="hall-icon">📖</span>
            <span class="hall-name">小说馆</span>
            <span class="hall-en">Novels</span>
        </a>
    </main>

    <footer>NOW SHOWING · 严禁外传 · PRIVATE COLLECTION</footer>
</body>

</html>
