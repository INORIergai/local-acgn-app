         C376 400 370 442 344 466
         C318 490 274 496 250 482
         C222 466 216 436 224 404
         C234 366 246 336 244 296
         C242 218 214 150 260 150 Z" fill="url(#hairG)"></path>

<!-- ═══ head ═══ -->
<ellipse cx="260" cy="248" rx="104" ry="98" fill="#F6EFE3"></ellipse>
<!-- head shading -->
<g clip-path="url(#headC)">
  <ellipse cx="352" cy="256" rx="26" ry="74" fill="#E3D5C1" opacity=".22"></ellipse>
  <ellipse cx="260" cy="300" rx="86" ry="18" fill="#EADDCA" opacity=".26"></ellipse>
</g>

