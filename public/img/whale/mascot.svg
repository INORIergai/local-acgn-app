  <ellipse cx="216" cy="256" rx="21" ry="24" fill="#12213A"></ellipse>
  <ellipse cx="304" cy="256" rx="21" ry="24" fill="#12213A"></ellipse>
  <!-- iris -->
  <ellipse cx="216" cy="258" rx="15" ry="18" fill="#2E6FA8"></ellipse>
  <ellipse cx="304" cy="258" rx="15" ry="18" fill="#2E6FA8"></ellipse>
  <ellipse cx="216" cy="262" rx="10" ry="12" fill="#0F2A45"></ellipse>
  <ellipse cx="304" cy="262" rx="10" ry="12" fill="#0F2A45"></ellipse>
  <!-- highlight -->
  <circle cx="209" cy="248" r="5.4" fill="#F2FAFF" opacity=".92"></circle>
  <circle cx="297" cy="248" r="5.4" fill="#F2FAFF" opacity=".92"></circle>
  <circle cx="223" cy="268" r="2.6" fill="#BFE0FF" opacity=".55"></circle>
  <circle cx="311" cy="268" r="2.6" fill="#BFE0FF" opacity=".55"></circle>
  <!-- upper lash -->
  <path d="M195 240 C204 228 228 228 237 240" stroke="#0D1A2C" stroke-width="4" fill="none" stroke-linecap="round"></path>
  <path d="M283 240 C292 228 316 228 325 240" stroke="#0D1A2C" stroke-width="4" fill="none" stroke-linecap="round"></path>
  <!-- lower lash hint -->
  <path d="M198 272 C206 280 226 280 234 272" stroke="#0D1A2C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"></path>
  <path d="M286 272 C294 280 314 280 322 272" stroke="#0D1A2C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"></path>
  <!-- brows -->
  <path d="M198 218 C208 212 226 212 234 216" stroke="#16283F" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55"></path>
  <path d="M286 216 C294 212 312 212 322 218" stroke="#16283F" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55"></path>
  <!-- blush -->
  <ellipse cx="188" cy="284" rx="15" ry="8" fill="#D08E8E" opacity=".26"></ellipse>
  <ellipse cx="332" cy="284" rx="15" ry="8" fill="#D08E8E" opacity=".26"></ellipse>
