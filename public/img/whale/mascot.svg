<!-- ═══ whale-mask hairpin (signature) ═══ -->
<g transform="translate(322 206) rotate(8)">
  <path d="M0 0 C14 -7 30 -5 39 4 C30 13 14 15 0 7 Z" fill="#142B49" stroke="#C9A868" stroke-width="1.4"></path>
