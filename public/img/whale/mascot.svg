  <circle cx="126" cy="200" r="6"></circle><circle cx="108" cy="246" r="3.4"></circle>
  <circle cx="140" cy="158" r="2.6"></circle>
  <circle cx="410" cy="170" r="5"></circle><circle cx="428" cy="212" r="3"></circle>
