  <path d="M414 272 C400 250 378 236 366 242 C376 260 396 276 416 285 Z" fill="#2C5A8C"></path>
  <path d="M338 384 C372 374 400 352 416 324" stroke="#9CCBEF" stroke-opacity=".35" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
</g>

<!-- ═══ body / dress ═══ -->
