<path d="M196 194 C224 174 300 170 334 198" stroke="#3D6294" stroke-opacity=".45" stroke-width="2.2" fill="none" stroke-linecap="round"></path>

<!-- ═══ facE: large chibi eyes ═══ -->
<g>
