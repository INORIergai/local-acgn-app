<svg viewBox="46 96 428 428" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="hairG" x1=".2" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#3A6394"></stop><stop offset=".5" stop-color="#22456E"></stop><stop offset="1" stop-color="#152C4A"></stop>
  </linearGradient>
  <linearGradient id="dressG" x1=".3" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#4A7CAE"></stop><stop offset=".55" stop-color="#35618F"></stop><stop offset="1" stop-color="#24476E"></stop>
  </linearGradient>
  <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4E86BF"></stop><stop offset="1" stop-color="#2A5686"></stop>
  </linearGradient>
  <clipPath id="headC"><ellipse cx="260" cy="248" rx="104" ry="98"></ellipse></clipPath>
  <filter id="b4"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
  <radialGradient id="pearlG" cx="50%" cy="40%" r="62%">
    <stop offset="0" stop-color="#DCEBF9" stop-opacity=".96"></stop>
    <stop offset=".62" stop-color="#BFD9EF" stop-opacity=".92"></stop>
    <stop offset="1" stop-color="#9CBFDD" stop-opacity=".88"></stop>
  </radialGradient>
</defs>

<!-- pearl backing disc: separates the mascot from dark UI -->
<ellipse cx="260" cy="262" rx="208" ry="208" fill="url(#pearlG)"></ellipse>
<ellipse cx="260" cy="262" rx="208" ry="208" fill="none" stroke="#C9A868" stroke-opacity=".34" stroke-width="1.8"></ellipse>

<!-- ═══ tail (behind body) ═══ -->
<g>
