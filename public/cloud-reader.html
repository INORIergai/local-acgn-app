<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>网盘阅读器</title>
<link rel="stylesheet" href="css/reader-settings.css?v=2">
<style>
    :root { --bg:#f7f7f7; --card:#fff; --ink:#111; --muted:#6b7280; --line:#e5e5e5; --accent:#d62e67;
            --rd-dur:560ms; --rd-read-bg:#ffffff; --rd-read-ink:#111111; }
    @media (prefers-color-scheme: dark) {
        :root { --bg:#141414; --card:#1c1c1c; --ink:#ededed; --muted:#9ca3af; --line:#2c2c2c; --accent:#ff5b8f;
                --rd-read-bg:#141414; --rd-read-ink:#ededed; }
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",system-ui,sans-serif; height:100vh; overflow:hidden; }
    #bar { height:44px; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--card); border-bottom:1px solid var(--line); font-size:13px; }
    #bar .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
    #bar .page { color:var(--muted); font-variant-numeric:tabular-nums; }
    #bar button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
    #bar button:hover { border-color:var(--accent); color:var(--accent); }
    #bar button.on { border-color:var(--accent); color:#fff; background:var(--accent); }
    #stage { height:calc(100vh - 44px); overflow:auto; background:var(--rd-read-bg); }
    #msg { padding:48px 24px; text-align:center; color:var(--muted); line-height:1.9; }
    #msg b { color:var(--ink); }
    /* PDF：整页纵向连续渲染 */
    #pages { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 0; }
    #pages canvas { background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.18); border-radius:2px; }
    .ph { width:min(92vw,900px); background:#0001; border-radius:2px; }
    /* EPUB/TXT */
    #read { display:none; height:100%; }
    #read.on { display:flex; }
    #toc { width:260px; overflow:auto; border-right:1px solid var(--line); background:var(--card); padding:10px; flex:0 0 auto; }
    #toc div { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--muted); }
    #toc div:hover { background:var(--bg); }
    #toc div.on { color:var(--accent); font-weight:600; }
    #body { flex:1; overflow:auto; padding:28px 32px 80px; line-height:1.85; font-size:16px;
            background:var(--rd-read-bg); color:var(--rd-read-ink); }
    #body img { max-width:100%; height:auto; }
    #body p { margin:0 0 1em; }

    /* ---- round103：单图章节（图片漫画的一页）---- */
    #body.imgpage { padding:10px; text-align:center; }
    #body.imgpage img,
    #body.imgpage svg {
        display:block; margin:0 auto; width:auto; height:auto;
        max-width:100%; max-height:calc(100vh - 44px - 20px); object-fit:contain;
    }
    body[data-fit="width"] #body.imgpage img,
    body[data-fit="width"] #body.imgpage svg { width:100%; max-width:100%; max-height:none; }
    body[data-fit="none"] #body.imgpage img,
    body[data-fit="none"] #body.imgpage svg { width:auto; max-width:none; max-height:none; }
    /* 图片页右侧/左侧点击区提示 */
    #body.imgpage.clipaging { cursor:pointer; }

    /* ---- round103：翻页动画 ---- */
    #body.rd-anim.rd-fade { animation: rdBubbleFade var(--rd-dur) ease both; }
    #body.rd-anim.rd-slide { animation: rdBubbleSlide var(--rd-dur) cubic-bezier(.32,.72,0,1) both; }
    @keyframes rdBubbleFade { from { opacity:0; } to { opacity:1; } }
    @keyframes rdBubbleSlide { from { opacity:.35; transform:translateX(26px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) {
        #body.rd-anim { animation: none !important; }
    }

    /* ---- round103：设置抽屉（外壳；内部 .rs-* 见 css/reader-settings.css）---- */
    .rs-scrim { position:fixed; inset:0; background:rgba(0,0,0,.42); opacity:0; pointer-events:none;
                transition:opacity .25s ease; z-index:200; }
    .rs-scrim.on { opacity:1; pointer-events:auto; }
    .rs-drawer { position:fixed; right:-380px; top:0; bottom:0; width:380px; max-width:90vw;
                 background:var(--card); color:var(--ink); border-left:1px solid var(--line);
                 box-shadow:-8px 0 26px rgba(0,0,0,.28); z-index:210; overflow:auto;
                 padding:20px 18px 40px; transition:right .3s cubic-bezier(.32,.72,0,1); }
    .rs-drawer.on { right:0; }
    body.night-mode .rs-drawer { background:#17171c; color:#e8e6e1; }
    .rs-drawer .rs-title { color:inherit; border-bottom-color:rgba(127,127,127,.25); }
    .rs-drawer .rs-label { color:rgba(127,127,127,.95); }
    .rs-drawer .rs-hint { color:rgba(127,127,127,.7); }
    .rs-drawer .rs-option { border-color:rgba(127,127,127,.35); color:inherit; }
    .rs-drawer .rs-option.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #khint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="bar">
    <span class="name" id="name">网盘文件</span>
    <span class="page" id="page"></span>
    <span id="khint"></span>
    <button id="zoomOut" style="display:none">－</button>
    <button id="zoomIn" style="display:none">＋</button>
    <button id="btnPaging" title="左右翻页模式：点击页面左右两侧或方向键翻页">翻页模式</button>
    <button id="btnSet" title="阅读设置">Aa</button>
</div>
<div id="stage">
    <div id="msg">正在加载…</div>
    <div id="pages" style="display:none"></div>
    <div id="read"><div id="toc"></div><div id="body"></div></div>
</div>
<div class="rs-scrim" id="setScrim"></div>
<div class="rs-drawer" id="setDrawer" role="dialog" aria-label="阅读设置"><div id="setRoot"></div></div>

<!-- round81/103：阅读设置引擎（小说 / 漫画共用，cloud-reader 也接同一套 SCHEMA） -->
<script src="js/reader-settings.js?v=1"></script>
<script>
const params = new URLSearchParams(location.search);
const fid = params.get('fid') || '';
const name = params.get('name') || '网盘文件';
// round91：多网盘支持 —— provider 为空=夸克（历史行为），pan123/baidu 走官方授权代理
const provider = params.get('provider') || '';
// round102：KOOB.ONE 在线阅读 —— koobone=<kzo 书页地址>&vid=<卷 md5>，
// 走后端 /api/cloud/kmoe/koobone/*（服务端拿 KOOB.ONE 书库里的签名 EPUB 直链）
const kooboneUrl = params.get('koobone') || '';
const kooboneVid = params.get('vid') || '';
const kbQuery = `url=${encodeURIComponent(kooboneUrl)}&vid=${encodeURIComponent(kooboneVid)}`;
const streamUrl = kooboneUrl
    ? `/api/cloud/kmoe/koobone/read/epub?${kbQuery}`
    : (provider
        ? `/api/cloud/oauth/stream/${provider}?fid=${encodeURIComponent(fid)}`
        : `/api/cloud/quark/stream?fid=${encodeURIComponent(fid)}`);
const epubApiUrl = kooboneUrl
    ? `/api/cloud/kmoe/koobone/read/epub?${kbQuery}`
    : (provider
        ? `/api/cloud/oauth/read/${provider}/epub?fid=${encodeURIComponent(fid)}`
        : `/api/cloud/quark/read/epub?fid=${encodeURIComponent(fid)}`);
// round101：EPUB 内部资源（漫画 EPUB 页面图片）—— OAuth 网盘走资源端点，夸克暂无（保持原样）
const epubResBase = kooboneUrl
    ? `/api/cloud/kmoe/koobone/epub-res?${kbQuery}`
    : (provider
        ? `/api/cloud/oauth/epub-res/${provider}/${encodeURIComponent(fid)}`
        : null);
document.getElementById('name').textContent = name;
document.title = name;
const ext = kooboneUrl ? 'epub' : (name.split('.').pop() || '').toLowerCase();
const $ = id => document.getElementById(id);

/* ==========================================================================
   round103：阅读设置（字号 / 行距 / 字体 / 背景 / 翻页 / 图片适配）
   —— 复用 js/reader-settings.js 的 SCHEMA 与渲染，本页只负责 apply()。
   持久化 key：cvReaderSettings:novel|comic（与本地小说/漫画阅读器共用同一条）。
   ========================================================================== */
const FF_MAP = {
    serif: '"Songti SC","SimSun",Georgia,serif',
    sans: '"Segoe UI Variable","Microsoft YaHei",system-ui,sans-serif',
    kai: '"Kaiti SC",KaiTi,"STKaiti",serif',
    'hei-light': '"PingFang SC","Microsoft YaHei Light",system-ui,sans-serif'
};
let kind = 'novel';                 // 'novel' | 'comic'，epub 打开后再判定
let RS = (window.ReaderSettings ? ReaderSettings.load('novel') : null);
let imgPageMode = false;            // 当前章节是不是「整页一张图」的漫画页
const bodyEl = () => document.getElementById('body');

function settingsKey() { return kind; }
function loadSettingsFor(k) {
    RS = window.ReaderSettings ? ReaderSettings.load(k) : {};
}
function isDarkColor(hex) {
    const c = String(hex || '').replace('#', '');
    if (c.length < 6) return false;
    const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 < 132;
}
function applySettings() {
    if (!RS) return;
    const readBg = RS.bg || (kind === 'comic' ? '#12100c' : '#ffffff');
    const dark = isDarkColor(readBg) || !!RS.night;
    const readInk = dark ? '#e9e6df' : '#141414';
    const root = document.documentElement;
    root.style.setProperty('--rd-read-bg', RS.night ? '#1d1d20' : readBg);
    root.style.setProperty('--rd-read-ink', readInk);
    document.body.classList.toggle('night-mode', !!RS.night);
    document.body.dataset.readTheme = dark ? 'dark' : 'light';
    if (typeof RS.turnSpeed === 'string' && window.ReaderSettings) {
        root.style.setProperty('--rd-dur', ReaderSettings.speedMs(RS.turnSpeed) + 'ms');
    }
    document.body.dataset.fit = RS.fit || 'contain';

    const b = bodyEl();
    if (b) {
        if (kind === 'novel') {
            b.style.fontSize = (Number(RS.fontSize) || 16) + 'px';
            b.style.lineHeight = String(RS.lineHeight || 1.85);
            b.style.padding = '28px ' + (Number(RS.padding) || 20) * 2 + 'px 80px';
            b.style.fontFamily = FF_MAP[RS.fontFamily] || FF_MAP.sans;
        } else {
            // 漫画：没有字号概念（comic SCHEMA 用 fit/rtl/layout 替代）
            b.style.fontSize = '';
            b.style.lineHeight = '';
            b.style.padding = '';
            b.style.fontFamily = '';
        }
        b.style.color = readInk;
    }
    const stage = document.getElementById('stage');
    if (stage) stage.style.background = root.style.getPropertyValue('--rd-read-bg');
    updKeyboardHint();
}
function openSettings() {
    $('setRoot').innerHTML = '';
    if (window.ReaderSettings) ReaderSettings.render($('setRoot'), settingsKey(), RS, onPick, '⚙️ 阅读设置');
    $('setDrawer').classList.add('on');
    $('setScrim').classList.add('on');
}
function closeSettings() {
    $('setDrawer').classList.remove('on');
    $('setScrim').classList.remove('on');
}
function onPick(id, val) {
    RS[id] = val;
    if (window.ReaderSettings) ReaderSettings.save(settingsKey(), RS);
    // 排版类改动要重画当前章节（图片页的 max-height / 字号都要重新算）
    if (typeof relayout === 'function') relayout();
    applySettings();
    openSettings();   // 重绘选中态
}
$('btnSet').onclick = () => { $('setDrawer').classList.contains('on') ? closeSettings() : openSettings(); };
$('setScrim').onclick = closeSettings;
let relayout = null;

/* 翻页模式（点击左右区域翻页）开关 —— 仅对 EPUB 图片漫画生效 */
let clickPaging = true;
$('btnPaging').onclick = () => {
    clickPaging = !clickPaging;
    $('btnPaging').classList.toggle('on', clickPaging);
    updKeyboardHint();
    if (typeof syncPageCursor === 'function') syncPageCursor();
};
function updKeyboardHint() {
    const el = $('khint');
    if (!el) return;
    if (ext === 'epub') el.textContent = (RS && RS.rtl === 'rtl' && imgPageMode) ? '← 下一页 / → 上一页' : '← 上一页 / → 下一页';
    else if (ext === 'pdf') el.textContent = '滚动查看 · ＋－ 缩放';
    else el.textContent = '';
}
function syncPageCursor() {
    const b = bodyEl();
    if (!b) return;
    b.classList.toggle('clipaging', !!(clickPaging && imgPageMode));
}

function fail(html) { $('msg').innerHTML = html; $('msg').style.display = 'block'; $('pages').style.display = 'none'; }

// 服务端拿不到直链时返回 JSON（例如非会员超过 50MB），把原因原样告诉用户
async function explainFailure() {
    try {
        const r = await fetch(streamUrl, { headers: { Range: 'bytes=0-0' } });
        const ct = r.headers.get('content-type') || '';
        if (ct.includes('json')) {
            const j = await r.json();
            return j.msg || '读取失败';
        }
        if (!r.ok) return `读取失败：HTTP ${r.status}`;
    } catch (e) { return '读取失败：' + e.message; }
    return '读取失败';
}

/* ★ round26 续 #7：失败要说人话，并且给出「怎么修」。
   背景（已实测定位）：夸克直链由阿里 OSS 签名，CDN 会回呼 drive-auth.quark.cn
   校验 cookie；会话过期时回呼拒绝，返回 RequestDeniedByCallback / auth expired。
   而夸克普通 API 对过期 cookie 仍然 200 ⇒ 界面看着「已登录」，一取流就 403。
   所以这里识别到登录问题时，直接把「去重新扫码登录」端到用户面前。 */
function hintBlock(title, msg, why) {
    const authIssue = /登录已过期|尚未登录|重新扫码登录|认证失败|重新设置\s*Cookie|auth\s*expired|auth\s*not\s*found|QUARK_AUTH_EXPIRED|RequestDeniedByCallback/i.test(String(msg) + ' ' + String(why || ''));
    const dup = (why && why !== msg) ? `<br><span style="opacity:.75">${why}</span>` : '';
    const fix = authIssue
        ? '<div style="margin:18px auto 0;padding:14px 18px;border:1px solid var(--accent);border-radius:10px;'
        + 'text-align:left;display:block;max-width:520px;line-height:1.8">'
        + '<b style="color:var(--accent)">怎么修：</b><br>'
        + '① 夸克网盘的登录已过期 —— 文件列表还能读，但下载 / 在线阅读会被 CDN 拒绝。<br>'
        + '② 回到项目目录，<b>双击「夸克登录.bat」</b>，扫码重新登录（它会自动把新 Cookie 写回配置）。<br>'
        + '③ 重启容器（或刷新本页）后重试即可。</div>'
        : '';
    return `<b>${title}</b><br>${msg}${dup}${fix}`;
}

init();

async function init() {
    if (!kooboneUrl && !fid) return fail('缺少文件参数');   // round102：KOOB.ONE 书源用 url+vid，没有 fid
    if (ext === 'pdf') { kind = 'comic'; loadSettingsFor('comic'); $('btnPaging').style.display = 'none'; return initPdf(); }
    if (ext === 'txt') { kind = 'novel'; loadSettingsFor('novel'); $('btnPaging').style.display = 'none'; setTimeout(applySettings, 0); return initTxt(); }
    if (ext === 'epub') return initEpub();
    fail('不支持的格式：' + ext);
}

// ---------------- PDF ----------------
async function initPdf() {
    let pdfjsLib, pdfDoc;
    try {
        pdfjsLib = await import('/pdfjs/pdf.mjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.mjs';
        /* round52b：Electron33(Chrome130) 缺 ES2025 Uint8Array.toHex/fromBase64，
           pdfjs 6.2 在 worker 内调用即崩；取源码前置 polyfill 以 Blob 加载 */
        try {
            const _poly = "if(!Uint8Array.prototype.toHex){Uint8Array.prototype.toHex=function(){var s='';for(var i=0;i<this.length;i++)s+=this[i].toString(16).padStart(2,'0');return s;};}\nif(!Uint8Array.fromHex){Uint8Array.fromHex=function(h){h=String(h);var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;};}\nif(!Uint8Array.prototype.toBase64){Uint8Array.prototype.toBase64=function(){var s='';for(var i=0;i<this.length;i++)s+=String.fromCharCode(this[i]);return btoa(s);};}\nif(!Uint8Array.fromBase64){Uint8Array.fromBase64=function(s){var bin=atob(String(s));var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};}\n";
            const _wcode = await (await fetch(pdfjsLib.GlobalWorkerOptions.workerSrc)).text();
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                URL.createObjectURL(new Blob([_poly + _wcode], { type: 'text/javascript' }));
        } catch (e) { /* 回退原始路径 */ }
        const res = await fetch(streamUrl);
        if (!res.ok) throw new Error(await explainFailure());
        pdfDoc = await pdfjsLib.getDocument({ data: await res.arrayBuffer() }).promise;
    } catch (e) {
        const why = await explainFailure();
        const msg = (e && e.message && e.message !== '读取失败') ? e.message : why;
        return fail(hintBlock('PDF 打开失败', msg, why));
    }

    $('msg').style.display = 'none';
    const holder = $('pages');
    holder.style.display = 'flex';
    $('zoomIn').style.display = '';
    $('zoomOut').style.display = '';

    const first = await pdfDoc.getPage(1);
    const baseVp = first.getViewport({ scale: 1 });
    const fitWidth = Math.min(window.innerWidth * 0.92, 900);
    let scale = fitWidth / baseVp.width;

    const placeholders = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
        const vp = (i === 1 ? first : await pdfDoc.getPage(i)).getViewport({ scale });
        const ph = document.createElement('div');
        ph.className = 'ph';
        ph.style.height = vp.height + 'px';
        ph.style.width = vp.width + 'px';
        ph.dataset.page = i;
        holder.appendChild(ph);
        placeholders.push(ph);
    }

    // 只渲染进入视口的页
    const seen = new Set();
    const io = new IntersectionObserver(async (entries) => {
        for (const en of entries) {
            const n = Number(en.target.dataset.page);
            if (!en.isIntersecting || seen.has(n)) continue;
            seen.add(n);
            try {
                const page = n === 1 ? first : await pdfDoc.getPage(n);
                const vp = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = vp.width; canvas.height = vp.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                en.target.replaceChildren(canvas);
                en.target.style.height = 'auto';
            } catch (e) { seen.delete(n); }
        }
    }, { root: $('stage'), rootMargin: '600px 0px' });
    placeholders.forEach(p => io.observe(p));

    // 缩放：重建占位块
    $('zoomIn').onclick = () => setScale(scale * 1.25);
    $('zoomOut').onclick = () => setScale(scale / 1.25);
    async function setScale(next) {
        scale = Math.max(0.25, Math.min(4, next));
        seen.clear();
        for (const ph of placeholders) {
            const n = Number(ph.dataset.page);
            const { width, height } = (await pdfDoc.getPage(n)).getViewport({ scale });
            ph.style.width = width + 'px';
            ph.style.height = height + 'px';
            ph.replaceChildren();
            io.observe(ph);
        }
    }

    // 当前页码
    $('stage').onscroll = () => {
        const mid = $('stage').scrollTop + $('stage').clientHeight / 2;
        let cur = 1;
        for (const ph of placeholders) { if (ph.offsetTop <= mid) cur = Number(ph.dataset.page); }
        $('page').textContent = `${cur} / ${pdfDoc.numPages}`;
    };
    $('page').textContent = `1 / ${pdfDoc.numPages}`;
    applySettings();
}

// ---------------- TXT ----------------
async function initTxt() {
    try {
        const r = await fetch(streamUrl);
        if (!r.ok) throw new Error(await explainFailure());
        const text = await r.text();
        $('msg').style.display = 'none';
        $('read').classList.add('on');
        $('toc').style.display = 'none';
        $('body').textContent = text;
        applySettings();
    } catch (e) {
        const why = await explainFailure();
        fail(hintBlock('文本打开失败', e.message, why));
    }
}

// ---------------- EPUB ----------------
async function initEpub() {
    let data;
    try {
        const r = await fetch(epubApiUrl);   // round91：跟随 provider（夸克/123云盘/百度网盘）
        const j = await r.json();
        if (j.code !== 0) throw new Error(j.msg || '解析失败');
        data = j.data;
    } catch (e) {
        const why = await explainFailure();
        const msg = (e && e.message) ? e.message : why;
        return fail(hintBlock('EPUB 打开失败', msg, why));
    }

    const chapters = data.chapters || [];
    $('msg').style.display = 'none';
    $('read').classList.add('on');
    document.title = data.title || name;
    $('name').textContent = data.title ? `${data.title}${data.author ? ' · ' + data.author : ''}` : name;

    /* round103：判定这本是「文字小说」还是「图片漫画」——
       图片漫画要的不是字号而是图片适配 / 单双页 / 阅读方向。 */
    const anyImg = chapters.some(c => /<(img|image)\b/i.test(String(c.html || '')));
    const textLen = chapters.reduce((n, c) => n + String(c.text || '').replace(/\s/g, '').length, 0);
    kind = (anyImg && textLen < 3000) ? 'comic' : 'novel';
    loadSettingsFor(kind);
    applySettings();

    // round101：漫画 EPUB 的章节 HTML 里是相对路径的 <img>/<svg image>（如 ../Images/p1.jpg），
    // 没有资源服务就是一堆损坏图。这里把相对引用解析成 zip 内绝对路径，重写到服务端资源端点。
    function rewriteEpubAssets(html, chapterHref) {
        if (!epubResBase || !html) return html;
        const baseDir = String(chapterHref || '').split('/').slice(0, -1).join('/');
        const resolve = (raw) => {
            if (!raw || /^(https?:|data:|blob:)/i.test(raw)) return null;
            let p = String(raw).split('#')[0];
            if (!p) return null;
            p = decodeURIComponent(p);
            const parts = (baseDir ? baseDir.split('/') : []).concat(p.split('/'));
            const stack = [];
            for (const seg of parts) {
                if (!seg || seg === '.') continue;
                if (seg === '..') stack.pop(); else stack.push(seg);
            }
            return stack.join('/');
        };
        try {
            const tpl = document.createElement('template');
            tpl.innerHTML = html;
            const fix = (el, attr) => {
                const v = el.getAttribute(attr);
                if (!v) return;
                const abs = resolve(v);
                // round102：koobone 书源的 epubResBase 已带 query（?url=&vid=）——
                // 无条件拼 '?path=' 会把 path 并进 vid 里（图片全 404）。按需选 & / ?
                if (abs) el.setAttribute(attr, `${epubResBase}${epubResBase.includes('?') ? '&' : '?'}path=${encodeURIComponent(abs)}`);
            };
            tpl.content.querySelectorAll('img').forEach(el => {
                fix(el, 'src');
                // HTML 解析器会把 SVG 的 <image href="..."> 转成 <img href="...">（属性不叫 src）
                fix(el, 'href');
            });
            // Kindle 漫画常用 SVG <image href> / xlink:href
            tpl.content.querySelectorAll('image').forEach(el => {
                fix(el, 'href');
                fix(el, 'xlink:href');
            });
            return tpl.innerHTML;
        } catch (e) { return html; }
    }

    const toc = $('toc');
    toc.innerHTML = chapters.map((c, i) =>
        `<div data-i="${i}" class="${i === 0 ? 'on' : ''}">${c.title || c.href || ('第 ' + (i + 1) + ' 章')}</div>`
    ).join('');
    toc.onclick = (e) => {
        const li = e.target.closest('div[data-i]');
        if (li) show(Number(li.dataset.i), 0);
    };

    // 章节是不是「整页一张图」（图片漫画的判定，用于点击翻页与图片适配）
    function chapterIsImagePage(ch) {
        if (!ch) return false;
        const html = String(ch.html || '');
        const imgs = (html.match(/<(img|image)\b/gi) || []).length;
        if (!imgs) return false;
        const txt = html.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
        return txt.length <= 24;   // 只有“第 N 頁”这类页码文字
    }

    // 预取下一张图（漫画每章一张图，翻页前先让浏览器缓存好）
    const preloaded = new Set();
    function preload(i) {
        const ch = chapters[i];
        if (!ch || preloaded.has(i)) return;
        preloaded.add(i);
        try {
            const tpl = document.createElement('template');
            tpl.innerHTML = rewriteEpubAssets(ch.html, ch.href) || '';
            tpl.content.querySelectorAll('img[src], image[href], img[href]').forEach(el => {
                const u = el.getAttribute('src') || el.getAttribute('href') || el.getAttribute('xlink:href');
                if (u) { const im = new Image(); im.decoding = 'async'; im.src = u; }
            });
        } catch (e) { /* 忽略 */ }
    }

    let cur = 0;
    function show(i, dir) {
        const idx = Math.max(0, Math.min(chapters.length - 1, i));
        const ch = chapters[idx] || {};
        const raw = rewriteEpubAssets(ch.html, ch.href) ||
            `<pre style="white-space:pre-wrap;font:inherit">${ch.text || '（空章节）'}</pre>`;
        cur = idx;

        const b = bodyEl();
        imgPageMode = chapterIsImagePage(ch);
        b.classList.toggle('imgpage', imgPageMode);
        const st = (RS && RS.turnStyle) || 'fade';
        b.className = b.className.replace(/\brd-anim\b|\brd-(fade|slide|curl|none)\b/g, '').trim();
        if (st !== 'none' && window.matchMedia && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            b.className += ' rd-anim rd-' + (st === 'curl' ? 'slide' : st);
        }
        b.innerHTML = raw;
        b.scrollTop = 0;
        $('stage').scrollTop = 0;

        [...toc.children].forEach((d, k) => d.classList.toggle('on', k === idx));
        $('page').textContent = `${idx + 1} / ${chapters.length}`;
        syncPageCursor();
        updKeyboardHint();
        preload(idx + 1);
        preload(idx - 1);
        if (autoTurn) autoTurn.restart();
    }
    relayout = () => { if (chapters.length) { const i = cur; cur = -1; show(i, 0); } };

    /* 方向键 / 点击左右区域翻页（round103 用户要求：图片漫画能上一张下一张） */
    function step(d) {
        if (!chapters.length) return;
        const n = cur + d;
        if (n < 0) return;
        if (n >= chapters.length) return;
        show(n, d);
    }
    document.addEventListener('keydown', (e) => {
        if (e.target && e.target.matches && e.target.matches('input,select,textarea')) return;
        let next = ['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key);
        let prev = ['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key);
        // 日漫右翻（rtl）：方向键语义反过来
        if (imgPageMode && RS && RS.rtl === 'rtl') { const t = next; next = prev; prev = t; }
        if (next) { e.preventDefault(); step(1); }
        else if (prev) { e.preventDefault(); step(-1); }
    });
    bodyEl().addEventListener('click', (e) => {
        if (!clickPaging || !imgPageMode) return;
        const r = bodyEl().getBoundingClientRect();
        const x = e.clientX - r.left;
        if (x < r.width * 0.3) step((RS && RS.rtl === 'rtl') ? 1 : -1);
        else if (x > r.width * 0.7) step((RS && RS.rtl === 'rtl') ? -1 : 1);
    });

    // 自动翻页（SCHEMA.common.autoTurn）
    const autoTurn = window.ReaderSettings ? ReaderSettings.autoTurn(() => (RS && RS.autoTurn) || 0, () => step(1)) : null;

    // 开头往往是只有封面图的空章节，直接跳到第一个有正文的
    const hasText = (c) => {
        if ((c.text || '').trim().length > 0) return true;
        return String(c.html || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim().length > 20;
    };
    let start = chapters.findIndex(hasText);
    if (start < 0) start = 0;   // 整本都是图（漫画）→ 从头开始
    show(start, 0);

    // 键盘焦点：iframe 里不点一下收不到 keydown
    try { window.focus(); } catch (e) { /* 忽略 */ }
    document.addEventListener('mousedown', () => { try { window.focus(); } catch (e) {} }, { once: true });
}
</script>
</body>
</html>
