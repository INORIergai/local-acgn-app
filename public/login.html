<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检票 · 午夜场</title>
    <style>
        :root {
            --bg: #131110;
            --bg-elevated: #1C1915;
            --text: #EFE9DC;
            --text-muted: #9C9282;
            --border: #2E2820;
            --primary: #E5A63C;
            --danger: #D2543C;
            --font-display: Georgia, "Times New Roman", "STZhongsong", "SimSun", serif;
            --font-body: "Segoe UI", "Microsoft YaHei", sans-serif;
            --font-mono: "Cascadia Mono", Consolas, monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% -10%, rgba(229, 166, 60, 0.08), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            padding: 20px;
        }

        .ticket {
            width: min(400px, 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-elevated);
            overflow: hidden;
            box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8);
        }

        /* 撕票线上的齿孔 */
        .ticket-teeth {
            height: 12px;
            background-color: #0C0B09;
            background-image: radial-gradient(circle at 50% 50%, var(--bg-elevated) 3px, transparent 3.6px);
            background-size: 20px 12px;
            background-position: center;
        }

        .ticket-body { padding: 38px 36px 32px; }

        .marquee {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .bulb {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px 1px rgba(229, 166, 60, 0.7);
            animation: pulse 2.4s ease-in-out infinite;
        }
        .bulb:nth-child(2) { animation-delay: .3s; }
        .bulb:nth-child(3) { animation-delay: .6s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        h1 {
            font-family: var(--font-display);
            font-size: 26px;
            margin: 0 0 4px;
            letter-spacing: 0.03em;
        }

        .sub {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        #pwd {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            font-family: var(--font-mono);
            letter-spacing: 0.2em;
            outline: none;
            transition: border-color 0.15s;
        }
        #pwd:focus { border-color: var(--primary); }

        #err {
            min-height: 20px;
            font-size: 12.5px;
            color: var(--danger);
            margin-top: 8px;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 6px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #131110;
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover { background: #F2BC5E; }
        button:active { transform: translateY(1px); }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
        }
        .back:hover { color: var(--primary); }

        .ticket-foot {
            padding: 14px 36px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            color: var(--text-muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .bulb { animation: none; }
        }
    </style>
</head>

<body>
    <div class="ticket">
        <div class="ticket-teeth"></div>
        <div class="ticket-body">
            <div class="marquee"><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span></div>
            <h1>午夜场</h1>
            <div class="sub">CINEMA VAULT · ADMIT ONE</div>
            <label for="pwd">Access Password · 访问口令</label>
            <input type="password" id="pwd" placeholder="••••••" autocomplete="current-password">
            <div id="err"></div>
            <button id="enterBtn">检票入场</button>
            <a class="back" href="/">← 返回大厅</a>
        </div>
        <div class="ticket-foot">
            <span>SEAT — ANY</span>
            <span id="footType">SCREEN — JAV</span>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'jav';
        const screenNames = { jav: 'JAV', anime: 'ANIME', comic: 'COMIC', novel: 'NOVEL' };
        document.getElementById('footType').textContent = 'SCREEN — ' + (screenNames[type] || 'JAV');

        const input = document.getElementById('pwd');
        const err = document.getElementById('err');
        const btn = document.getElementById('enterBtn');

        /* 访问密码是可选开关。若已关闭（或别人刚在设置里关掉），
         * 别再让用户对着一个没用的口令框发愣 —— 直接放行进库。 */
        fetch('/api/auth/status').then(r => r.json()).then(d => {
            if (d && d.data && d.data.authEnabled === false) {
                window.location.replace('/library.html?type=' + encodeURIComponent(type));
            }
        }).catch(() => { /* 探不到就老老实实显示口令框 */ });

        async function submit() {
            const password = input.value;
            if (!password) { err.textContent = '请输入口令'; return; }
            btn.disabled = true;
            btn.textContent = '检票中…';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.code === 0) {
                    window.location.href = '/library.html?type=' + encodeURIComponent(type);
                    return;
                }
                err.textContent = data.msg || '口令错误，请重试';
            } catch (e) {
                err.textContent = '网络异常：' + e.message;
            }
            btn.disabled = false;
            btn.textContent = '检票入场';
            input.value = '';
            input.focus();
        }

        btn.addEventListener('click', submit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        setTimeout(() => input.focus(), 100);
    </script>
</body>

</html>
