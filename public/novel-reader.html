<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说阅读器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f0e6;
            color: #333;
            overflow: hidden;
            height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        body.night-mode {
            background: #1a1a1a;
            color: #999;
        }
        
        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        body.night-mode .toolbar {
            background: rgba(30, 30, 30, 0.9);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        
        .toolbar.hidden {
            transform: translateY(-100%);
        }
        
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .toolbar-title {
            font-size: 14px;
            font-weight: 600;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.05);
            color: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        body.night-mode .btn {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        
        body.night-mode .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .btn-primary {
            background: #d5187d;
            color: white;
        }
        
        .btn-primary:hover {
            background: #a81266;
        }
        
        /* 阅读区域：衬线正文 + 居中阅读列（参照纸质书排印） */
        .reader-area {
            flex: 1;
            overflow-y: auto;
            padding: 80px 20% 100px;
            line-height: 1.8;
            font-size: 18px;
            transition: padding 0.3s ease;
            position: relative;          /* 翻页模式的绝对定位层以此为准 */
        }
        /* 翻页模式下阅读区不再滚动（翻页层自己管分页） */
        body.read-mode-page .reader-area {
            overflow: hidden;
            padding: 0;
        }

        #chapterContent {
            max-width: 700px;
            margin: 0 auto;
        }
        /* 章节切换：新章淡入上浮，翻篇有"纸感"而不是硬切 */
        #chapterContent.chapter-in {
            animation: chapterIn .45s cubic-bezier(.32, .72, 0, 1);
        }
        @keyframes chapterIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #chapterContent.chapter-in { animation: none; }
        }

        .chapter-title {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            letter-spacing: .04em;
        }

        body.night-mode .chapter-title {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .chapter-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            text-indent: 2em;
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', 'PingFang SC', serif;
            text-align: justify;
            text-justify: inter-ideograph;
        }

        .chapter-content p {
            margin-bottom: 1em;
        }

        /* ===== 2026-09-25（round25 #2）：正文插图 =====
           把 epub 里 <img> 提到段落级，不做首行缩进、不强制小尺寸，
           整页彩插（含 <svg><image> 转来的 .novel-pageimg）就让它铺满阅读列。 */
        .chapter-content img.novel-illus {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.2em auto;
            border-radius: 6px;
            text-indent: 0;
        }
        .chapter-content img.novel-pageimg {
            width: 100%;
            max-width: 100%;
            margin: .2em auto;
            border-radius: 0;
        }
        .chapter-content p:has(> img.novel-illus) {
            text-indent: 0;
            text-align: center;
        }

        /* ===== 2026-09-25（round25 #2）：翻页阅读模式 ===== */
        .paged-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 78px 20% 92px;
            box-sizing: border-box;
        }
        .paged-inner {
            flex: 1;
            min-height: 0;
            overflow: hidden;              /* 只显示当前一页，多余裁掉 */
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }
        .paged-inner .chapter-content {
            height: 100%;
            overflow: hidden;
        }
        .paged-hint {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-top: 10px;
            font-size: 13px;
            color: rgba(0, 0, 0, .5);
        }
        body.night-mode .paged-hint { color: rgba(255, 255, 255, .5); }
        .paged-btn {
            border: 1px solid rgba(0, 0, 0, .16);
            background: rgba(255, 255, 255, .7);
            color: inherit;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background .18s ease, transform .18s ease;
        }
        .paged-btn:hover { background: rgba(255, 255, 255, .95); transform: translateY(-1px); }
        body.night-mode .paged-btn {
            border-color: rgba(255, 255, 255, .2);
            background: rgba(255, 255, 255, .08);
        }
        body.night-mode .paged-btn:hover { background: rgba(255, 255, 255, .16); }
        /* 翻页时右侧残留做一次轻微淡入，像翻过一页纸 */
        #pagedText.page-in { animation: pageIn .22s ease; }
        @keyframes pageIn { from { opacity: .35; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            #pagedText.page-in { animation: none; }
        }
        @media (max-width: 860px) {
            .paged-content { padding: 66px 16px 84px; }
        }
        
        /* 加载提示 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: rgba(0, 0, 0, 0.5);
            padding: 100px 0;
        }
        
        body.night-mode .loading {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #d5187d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        body.night-mode .spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #d5187d;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 底部进度栏 */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        body.night-mode .progress-bar {
            background: rgba(30, 30, 30, 0.9);
            border-top-color: rgba(255, 255, 255, 0.1);
        }
        
        .progress-bar.hidden {
            transform: translateY(100%);
        }
        
        .chapter-info {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
            min-width: 120px;
            text-align: center;
        }
        
        body.night-mode .chapter-info {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .progress-slider {
            flex: 1;
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        body.night-mode .progress-slider {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F9A220, #d5187d);
            border-radius: 2px;
            width: 0%;
            transition: width 0.25s cubic-bezier(.32, .72, 0, 1);
        }
        
        .reading-time {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.5);
            min-width: 60px;
            text-align: right;
        }
        
        body.night-mode .reading-time {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            right: -320px;
            top: 0;
            bottom: 0;
            width: 320px;
            background: white;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 200;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }
        
        body.night-mode .settings-panel {
            background: #2a2a2a;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .settings-panel.open {
            right: 0;
        }
        
        .settings-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        body.night-mode .settings-title {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        
        .setting-group {
            margin-bottom: 24px;
        }
        
        .setting-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            color: rgba(0, 0, 0, 0.7);
        }
        
        body.night-mode .setting-label {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .setting-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .setting-option {
            padding: 6px 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        
        body.night-mode .setting-option {
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .setting-option.active {
            background: #d5187d;
            color: white;
            border-color: #d5187d;
        }
        
        .setting-option:hover {
            border-color: #d5187d;
        }
        
        /* 背景色选择 */
        .bg-colors {
            display: flex;
            gap: 10px;
        }
        
        .bg-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .bg-color.active {
            border-color: #d5187d;
            transform: scale(1.1);
        }
        
        /* 目录侧边栏 */
        .catalog-sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            bottom: 0;
            width: 300px;
            background: white;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 200;
            transition: left 0.3s ease;
            overflow-y: auto;
        }
        
        body.night-mode .catalog-sidebar {
            background: #2a2a2a;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .catalog-sidebar.open {
            left: 0;
        }
        
        .catalog-header {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            background: white;
        }
        
        body.night-mode .catalog-header {
            background: #2a2a2a;
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
        
        .catalog-list {
            padding: 10px 0;
        }
        
        .catalog-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }
        
        .catalog-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        body.night-mode .catalog-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .catalog-item.current {
            background: rgba(213, 24, 125, 0.1);
            border-left-color: #d5187d;
            color: #d5187d;
        }
        
        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            display: none;
        }
        
        .overlay.visible {
            display: block;
        }
        
        /* 左右半屏切书点击区域 */
        .page-nav {
            position: fixed;
            top: 60px;
            bottom: 60px;
            width: 15%;
            cursor: pointer;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .page-nav:hover { opacity: 1; }
        .page-nav.prev {
            left: 0;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.12), transparent);
        }
        .page-nav.next {
            right: 0;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.12), transparent);
        }
        body.night-mode .page-nav.prev {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.06), transparent);
        }
        body.night-mode .page-nav.next {
            background: linear-gradient(to left, rgba(255, 255, 255, 0.06), transparent);
        }
        .page-nav-arrow {
            font-size: 40px;
            color: rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
        }
        body.night-mode .page-nav-arrow {
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        /* 轻量提示 toast */
        .reader-toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }
        body.night-mode .reader-toast {
            background: rgba(40, 40, 40, 0.9);
        }
        .reader-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div class="reader-container">
        <!-- 顶部工具栏 -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-left">
                <button class="btn" onclick="closeReader()">← 返回</button>
                <div class="toolbar-title" id="novelTitle">加载中...</div>
            </div>
            <div class="toolbar-right">
                <button class="btn" id="btnPrevBook" onclick="prevBook()" style="display:none;">◀ 上一本</button>
                <button class="btn" id="btnNextBook" onclick="nextBook()" style="display:none;">下一本 ▶</button>
                <button class="btn" id="btnReadMode" onclick="toggleReadMode()" title="切换 滚动 / 翻页 阅读">📖 翻页</button>
                <button class="btn" onclick="toggleCatalog()">📑 目录</button>
                <button class="btn" onclick="toggleSettings()">⚙️ 设置</button>
                <button class="btn" onclick="toggleNightMode()">🌙 夜间</button>
            </div>
        </div>
        
        <!-- 阅读区域 -->
        <div class="reader-area" id="readerArea" onclick="handleReaderClick(event)">
            <div class="page-nav prev" onclick="event.stopPropagation(); pageTurn(-1)">
                <div class="page-nav-arrow">‹</div>
            </div>
            <div class="page-nav next" onclick="event.stopPropagation(); pageTurn(1)">
                <div class="page-nav-arrow">›</div>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
            <!-- 滚动模式（原有）：整章纵向滚动 -->
            <div id="chapterContent" style="display:none;">
                <h1 class="chapter-title" id="chapterTitle"></h1>
                <div class="chapter-content" id="chapterText"></div>
            </div>
            <!-- 翻页模式（round25 #2）：一屏一页，左右翻 -->
            <div id="pagedContent" class="paged-content" style="display:none;">
                <div class="paged-inner">
                    <h1 class="chapter-title" id="pagedTitle"></h1>
                    <div class="chapter-content" id="pagedText"></div>
                </div>
                <div class="paged-hint">
                    <span id="pagedInfo">1 / 1</span>
                    <button class="paged-btn" onclick="event.stopPropagation(); pageTurn(-1)">‹ 上一页</button>
                    <button class="paged-btn" onclick="event.stopPropagation(); pageTurn(1)">下一页 ›</button>
                    <button class="paged-btn" onclick="event.stopPropagation(); pageTurn(1,true)">转下一章 »</button>
                </div>
            </div>
        </div>
        
        <!-- 目录侧边栏 -->
        <div class="catalog-sidebar" id="catalogSidebar">
            <div class="catalog-header">📑 目录</div>
            <div class="catalog-list" id="catalogList">
                <!-- 目录动态生成 -->
            </div>
        </div>
        
        <!-- 设置面板 -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-title">⚙️ 阅读设置</div>
            
            <div class="setting-group">
                <div class="setting-label">字号</div>
                <div class="setting-options">
                    <div class="setting-option" onclick="setFontSize(14)">小</div>
                    <div class="setting-option active" onclick="setFontSize(18)">中</div>
                    <div class="setting-option" onclick="setFontSize(22)">大</div>
                    <div class="setting-option" onclick="setFontSize(26)">特大</div>
                </div>
            </div>
            
            <div class="setting-group">
                <div class="setting-label">行距</div>
                <div class="setting-options">
                    <div class="setting-option" onclick="setLineHeight(1.5)">紧凑</div>
                    <div class="setting-option active" onclick="setLineHeight(1.8)">标准</div>
                    <div class="setting-option" onclick="setLineHeight(2.2)">宽松</div>
                </div>
            </div>
            
            <div class="setting-group">
                <div class="setting-label">背景色</div>
                <div class="bg-colors">
                    <div class="bg-color active" style="background:#f5f0e6;" onclick="setBgColor('#f5f0e6', false)"></div>
                    <div class="bg-color" style="background:#ffffff;" onclick="setBgColor('#ffffff', false)"></div>
                    <div class="bg-color" style="background:#c7edcc;" onclick="setBgColor('#c7edcc', false)"></div>
                    <div class="bg-color" style="background:#1a1a1a;" onclick="setBgColor('#1a1a1a', true)"></div>
                </div>
            </div>
            
            <div class="setting-group">
                <div class="setting-label">页边距</div>
                <div class="setting-options">
                    <div class="setting-option" onclick="setPadding(10)">窄</div>
                    <div class="setting-option active" onclick="setPadding(20)">标准</div>
                    <div class="setting-option" onclick="setPadding(30)">宽</div>
                </div>
            </div>
        </div>
        
        <!-- 遮罩层 -->
        <div class="overlay" id="overlay" onclick="closeAllPanels()"></div>
        
        <!-- 底部进度栏 -->
        <div class="progress-bar" id="progressBar">
            <button class="btn" onclick="prevChapter()">‹ 上一章</button>
            <div class="chapter-info" id="chapterInfo">0 / 0</div>
            <div class="progress-slider" id="progressSlider" onclick="seekChapter(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="reading-time" id="readingTime">00:00</div>
            <button class="btn btn-primary" onclick="nextChapter()">下一章 ›</button>
        </div>
    </div>
    
    <!-- 轻量提示 -->
    <div id="toast" class="reader-toast"></div>
    
    <script>
        // 全局状态
        let novelId = null;
        let novelInfo = null;
        let currentChapter = 0;
        let totalChapters = 0;
        let isNightMode = false;
        let readingStartTime = null;
        let totalReadingTime = 0;
        let readingTimer = null;
        let isToolbarVisible = true;
        let currentFontSize = 18;
        let currentLineHeight = 1.8;
        let currentPadding = 20;
        // 同级作品（上一本/下一本）
        let siblings = [];
        let currentBookIndex = -1;
        let toastTimer = null;

        /* ===== 2026-09-25（round25 #2）：翻页阅读模式状态 =====
           思路：不预先把文字切成固定块（字号/行距/窗口一变就全错），
           而是用「累计高度二分 + 分页游标」在渲染时动态分页：
             · pageStarts 记录本页第一个子块在第几个块上
             · fitPage() 从该块起尽可能多塞，塞不下就到上一块为止
           滚动模式完全不受影响（复用同一份 innerHTML）。 */
        let readMode = 'scroll';        // 'scroll' | 'page'
        let chapterBlocks = [];         // 当前章的块（字符串 HTML 片段）
        let pageStarts = [];            // 每页起始块下标
        let currentPage = 0;
        let chapterIsHtml = false;
        let pendingSeek = null;         // 换章后要跳到的进度位置
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            novelId = urlParams.get('id');
            
            if (!novelId) {
                alert('缺少小说ID');
                return;
            }
            
            parseSiblings(urlParams.get('siblings'));
            
            // 加载保存的设置
            loadSettings();
            
            loadNovelInfo();
            setupKeyboardControls();

            // 翻页模式下：窗口尺寸变化 / 字号行距变化都要重新分页（否则一页内容对不上屏）
            let rzTimer = null;
            window.addEventListener('resize', () => {
                if (readMode !== 'page') return;
                clearTimeout(rzTimer);
                rzTimer = setTimeout(async () => {
                    const keep = currentPage;
                    await paginate();
                    showPage(Math.min(keep, pageStarts.length - 1));
                }, 220);
            });
        });
        
        // 解析同级列表参数，初始化上一本/下一本
        function parseSiblings(raw) {
            if (!raw) return;
            try {
                const list = JSON.parse(raw);
                if (Array.isArray(list) && list.length > 1) {
                    siblings = list;
                    currentBookIndex = siblings.findIndex(s => String(s.id) === String(novelId));
                    document.getElementById('btnPrevBook').style.display = '';
                    document.getElementById('btnNextBook').style.display = '';
                }
            } catch (e) {
                console.log('同级列表解析失败:', e.message);
            }
        }
        
        // 轻量提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }
        
        // 切到上一本/下一本
        function prevBook() {
            if (currentBookIndex > 0) {
                switchBook(currentBookIndex - 1);
            } else {
                showToast('已是第一本');
            }
        }
        
        function nextBook() {
            if (currentBookIndex >= 0 && currentBookIndex < siblings.length - 1) {
                switchBook(currentBookIndex + 1);
            } else {
                showToast('已是最后一本');
            }
        }
        
        function switchBook(index) {
            const target = siblings[index];
            if (!target) return;
            const url = new URL(window.location.href);
            url.searchParams.set('id', target.id);
            url.searchParams.set('siblings', JSON.stringify(siblings));
            window.location.href = url.toString();
        }
        
        // 加载小说信息
        async function loadNovelInfo() {
            try {
                const res = await fetch(`/api/novel/${novelId}/info`);
                const data = await res.json();
                
                if (data.code === 0) {
                    novelInfo = data.data;
                    totalChapters = novelInfo.totalChapters;
                    currentChapter = novelInfo.currentChapter || 0;
                    
                    document.getElementById('novelTitle').textContent = novelInfo.title;
                    document.getElementById('chapterInfo').textContent = `${currentChapter + 1} / ${totalChapters}`;
                    
                    // 渲染目录
                    renderCatalog();
                    
                    if (totalChapters > 0) {
                        loadChapter(currentChapter);
                        startReadingTimer();
                    } else {
                        document.getElementById('loading').innerHTML = '<div style="color:#ef4444;">无法读取小说内容</div>';
                    }
                } else {
                    document.getElementById('loading').innerHTML = `<div style="color:#ef4444;">加载失败: ${data.msg}</div>`;
                }
            } catch (e) {
                document.getElementById('loading').innerHTML = `<div style="color:#ef4444;">加载失败: ${e.message}</div>`;
            }
        }
        
        // 加载章节
        async function loadChapter(chapterIndex) {
            if (chapterIndex < 0 || chapterIndex >= totalChapters) return;
            
            currentChapter = chapterIndex;
            const loading = document.getElementById('loading');
            const chapterContent = document.getElementById('chapterContent');
            
            loading.style.display = 'flex';
            chapterContent.style.display = 'none';
            
            try {
                const res = await fetch(`/api/novel/${novelId}/chapter/${chapterIndex}`);
                const data = await res.json();
                
                if (data.code === 0) {
                    const title = data.data.title || '';
                    const body = data.data.content || '';
                    chapterIsHtml = !!data.data.isHtml;

                    document.getElementById('chapterTitle').textContent = title;
                    document.getElementById('pagedTitle').textContent = title;

                    // ★ round25 #2：EPUB 走 innerHTML（保留插图），TXT 维持纯文本
                    renderChapterBody(body);

                    loading.style.display = 'none';
                    chapterContent.style.display = 'block';
                    // 章节入场动画（重触发）
                    chapterContent.classList.remove('chapter-in');
                    void chapterContent.offsetWidth;
                    chapterContent.classList.add('chapter-in');

                    // 滚动到顶部
                    document.getElementById('readerArea').scrollTop = 0;

                    // ★ 翻页模式：重新分页
                    if (readMode === 'page') {
                        await paginate();
                        let to = 0;
                        if (pendingSeek === 'last') to = pageStarts.length - 1;
                        else if (typeof pendingSeek === 'number') to = pendingSeek;
                        showPage(to);
                        pendingSeek = null;
                    }
                    
                    // 更新进度
                    document.getElementById('chapterInfo').textContent = `${currentChapter + 1} / ${totalChapters}`;
                    document.getElementById('progressFill').style.width = `${((currentChapter + 1) / totalChapters) * 100}%`;
                    
                    // 更新目录高亮
                    updateCatalogHighlight();
                    
                    // 保存进度
                    saveProgress();
                } else {
                    loading.innerHTML = `<div style="color:#ef4444;">加载失败: ${data.msg}</div>`;
                }
            } catch (e) {
                loading.innerHTML = `<div style="color:#ef4444;">加载失败: ${e.message}</div>`;
            }
        }

        /* ============================================================
           2026-09-25（round25 #2）富文本渲染 + 翻页分页
           ============================================================ */

        // 把整章内容写进两个容器（滚动用的和翻页用的共用同一份 HTML）
        function renderChapterBody(body) {
            const chat = document.getElementById('chapterText');
            const paged = document.getElementById('pagedText');
            if (chapterIsHtml) {
                // 后端已做白名单过滤；这里只补一个「外部图片失败降级」
                const safe = body || '';
                chat.innerHTML = safe;
                paged.innerHTML = safe;
                // 图片加载失败时给个占位，避免整页塌掉看不出来
                [chat, paged].forEach(root => {
                    root.querySelectorAll('img').forEach(img => {
                        if (img.dataset.guard) return;
                        img.dataset.guard = '1';
                        img.addEventListener('error', () => {
                            img.classList.add('img-broken');
                            if (!img.alt) img.alt = '［图片加载失败］';
                        });
                    });
                });
            } else {
                chat.textContent = body;
                paged.textContent = body;
            }
        }

        // 把当前章拆成「块」：EPUB 递归下钻到段落级，TXT 按段落
        function collectBlocks() {
            const src = document.getElementById('pagedText');
            if (chapterIsHtml) {
                chapterBlocks = [];
                const LEAF = /^(P|H1|H2|H3|H4|H5|H6|LI|DT|DD|BLOCKQUOTE|PRE|FIGURE|IMG|TABLE|HR)$/;
                // 递归：容器标签继续下钻，遇到叶子级标签就成一「块」
                const walk = (node) => {
                    for (const el of node.children) {
                        const t = el.tagName;
                        if (t === 'IMG' || LEAF.test(t)) {
                            // 叶子块：保留自身 HTML（顺带把紧邻的说明文字包进来也无妨）
                            chapterBlocks.push(el.outerHTML);
                        } else if (el.children.length) {
                            walk(el);
                        } else {
                            const txt = (el.textContent || '').trim();
                            if (txt) chapterBlocks.push(el.outerHTML);
                        }
                    }
                };
                walk(src);
                // 兜底：整章没有可拆的块（比如只有一个超长 <div> 文本）
                if (!chapterBlocks.length) {
                    const t = (src.textContent || '').trim();
                    chapterBlocks = t ? [src.innerHTML] : ['<p></p>'];
                }
            } else {
                const paras = (src.textContent || '').split(/\n+/).filter(t => t.trim());
                chapterBlocks = paras.map(t => `<p>${escapeHtmlText(t)}</p>`);
            }
            if (!chapterBlocks.length) chapterBlocks = ['<p></p>'];
        }

        function escapeHtmlText(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 下一页 / 上一页；atEnd=true 时到章末自动去下一章
        function pageTurn(dir, atEnd) {
            if (readMode !== 'page') {
                // 滚动模式：点侧边箭头仍按「上一本/下一本」处理
                if (dir < 0) prevBook(); else nextBook();
                return;
            }
            const last = pageStarts.length - 1;
            let target = currentPage + dir;
            if (target < 0) {
                if (currentChapter > 0) { pendingSeek = 'last'; loadChapter(currentChapter - 1); return; }
                target = 0;
            }
            if (target > last) {
                if (atEnd || currentPage === last) {
                    if (currentChapter < totalChapters - 1) { pendingSeek = 0; loadChapter(currentChapter + 1); return; }
                }
                target = last;
            }
            showPage(target);
        }

        function showPage(idx) {
            if (!pageStarts.length) return;
            currentPage = Math.max(0, Math.min(pageStarts.length - 1, idx));
            const box = document.getElementById('pagedText');
            const start = pageStarts[currentPage];
            const end = currentPage + 1 < pageStarts.length ? pageStarts[currentPage + 1] : chapterBlocks.length;
            box.innerHTML = chapterBlocks.slice(start, end).join('');
            // 图片重新挂 error 兜底
            box.querySelectorAll('img').forEach(img => {
                img.addEventListener('error', () => { img.classList.add('img-broken'); });
            });
            box.classList.remove('page-in');
            void box.offsetWidth;
            box.classList.add('page-in');
            document.getElementById('pagedInfo').textContent = `${currentPage + 1} / ${pageStarts.length}`;
            saveProgress();
        }

        // 按「容器实际高度」贪心分页；最后一页允许留白
        function paginate() {
            collectBlocks();
            const box = document.getElementById('pagedText');
            const container = document.querySelector('.paged-inner');
            const H = container ? container.clientHeight : 0;
            pageStarts = [0];
            if (!H || H < 40) {           // 容器还没布局出来 → 当作单页
                return;
            }
            // 用与正文同样的排版环境做测量（宽度/字号/行高都要一致）
            const probe = document.createElement('div');
            probe.className = box.className;
            probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;'
                + 'width:' + (box.clientWidth || container.clientWidth) + 'px;'
                + 'height:auto;overflow:visible;';
            container.appendChild(probe);

            let i = 0;
            while (i < chapterBlocks.length) {
                const pageStart = i;
                // 试探性塞入，直到超过容器高度
                let lastFit = i;      // 至少放一块，避免死循环
                for (; i < chapterBlocks.length; i++) {
                    probe.insertAdjacentHTML('beforeend', chapterBlocks[i]);
                    if (probe.scrollHeight > H + 2) {
                        // 这一块放不下：回退（把它留给下一页）
                        if (probe.lastElementChild) probe.removeChild(probe.lastElementChild);
                        break;
                    }
                    lastFit = i + 1;
                }
                probe.innerHTML = '';
                if (lastFit <= pageStart) lastFit = pageStart + 1;   // 单块就超高 → 独占一页
                i = lastFit;
                if (i < chapterBlocks.length) pageStarts.push(i);
                else break;
            }
            container.removeChild(probe);
            if (!pageStarts.length) pageStarts = [0];
        }

        // 切换 滚动 / 翻页
        async function toggleReadMode() {
            readMode = readMode === 'page' ? 'scroll' : 'page';
            applyReadMode();
            try { localStorage.setItem('novelReadMode', readMode); } catch (e) { }
            if (readMode === 'page') {
                await paginate();
                showPage(0);
                showToast('已切换到翻页模式（← → 翻页，↑ ↓ 换章）');
            } else {
                document.getElementById('readerArea').scrollTop = 0;
                showToast('已切换到滚动模式');
            }
        }

        function applyReadMode() {
            const paged = document.getElementById('pagedContent');
            const chat = document.getElementById('chapterContent');
            const btn = document.getElementById('btnReadMode');
            if (readMode === 'page') {
                document.body.classList.add('read-mode-page');
                paged.style.display = 'flex';
                chat.style.display = 'none';
                if (btn) btn.textContent = '📜 滚动';
            } else {
                document.body.classList.remove('read-mode-page');
                paged.style.display = 'none';
                chat.style.display = 'block';
                if (btn) btn.textContent = '📖 翻页';
            }
        }

        // 阅读区单击：翻页模式下点右侧翻下页、点左侧翻上页；滚动模式仍是切工具栏
        function handleReaderClick(e) {
            if (readMode === 'page') {
                const r = document.getElementById('readerArea').getBoundingClientRect();
                const x = e.clientX - r.left;
                if (x > r.width * 0.55) { pageTurn(1); return; }
                if (x < r.width * 0.22) { pageTurn(-1); return; }
                toggleToolbar();
                return;
            }
            toggleToolbar();
        }
        
        // 上一章
        function prevChapter() {
            if (currentChapter > 0) {
                loadChapter(currentChapter - 1);
            }
        }
        
        // 下一章
        function nextChapter() {
            if (currentChapter < totalChapters - 1) {
                loadChapter(currentChapter + 1);
            }
        }
        
        // 跳转到指定章节
        function seekChapter(event) {
            const slider = document.getElementById('progressSlider');
            const rect = slider.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            const targetChapter = Math.floor(percent * totalChapters);
            loadChapter(Math.max(0, Math.min(totalChapters - 1, targetChapter)));
        }
        
        // 保存阅读进度
        async function saveProgress() {
            try {
                await fetch(`/api/novel/${novelId}/progress`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chapter: currentChapter, position: 0 })
                });
            } catch (e) {
                console.log('保存进度失败:', e.message);
            }
        }
        
        // 开始阅读计时
        function startReadingTimer() {
            readingStartTime = Date.now();
            readingTimer = setInterval(() => {
                const elapsed = Date.now() - readingStartTime + totalReadingTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('readingTime').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
            // 通知服务器开始阅读（服务端开始计时）
            fetch(`/api/novel/${novelId}/start-reading`, { method: 'POST' }).catch(() => {});
        }
        
        // 停止阅读计时
        function stopReadingTimer() {
            if (readingTimer) {
                clearInterval(readingTimer);
                totalReadingTime += Date.now() - readingStartTime;
                readingTimer = null;
                // 通知服务器结束阅读并记录本次时长
                fetch(`/api/novel/${novelId}/stop-reading`, { method: 'POST' }).catch(() => {});
            }
        }
        
        // 渲染目录
        function renderCatalog() {
            const catalogList = document.getElementById('catalogList');
            catalogList.innerHTML = '';
            
            novelInfo.chapters.forEach((chapter, index) => {
                const item = document.createElement('div');
                item.className = 'catalog-item' + (index === currentChapter ? ' current' : '');
                item.textContent = `${index + 1}. ${chapter.title}`;
                item.onclick = () => {
                    loadChapter(index);
                    toggleCatalog();
                };
                catalogList.appendChild(item);
            });
        }
        
        // 更新目录高亮
        function updateCatalogHighlight() {
            document.querySelectorAll('.catalog-item').forEach((item, index) => {
                item.classList.toggle('current', index === currentChapter);
            });
        }
        
        // 切换目录
        function toggleCatalog() {
            const sidebar = document.getElementById('catalogSidebar');
            const overlay = document.getElementById('overlay');
            const isOpen = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', isOpen);
            
            if (isOpen) {
                document.getElementById('settingsPanel').classList.remove('open');
            }
        }
        
        // 切换设置面板
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const overlay = document.getElementById('overlay');
            const isOpen = panel.classList.toggle('open');
            overlay.classList.toggle('visible', isOpen);
            
            if (isOpen) {
                document.getElementById('catalogSidebar').classList.remove('open');
            }
        }
        
        // 关闭所有面板
        function closeAllPanels() {
            document.getElementById('catalogSidebar').classList.remove('open');
            document.getElementById('settingsPanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('visible');
        }
        
        // 切换夜间模式
        function toggleNightMode() {
            isNightMode = !isNightMode;
            document.body.classList.toggle('night-mode', isNightMode);
            saveSettings();
        }
        
        // 设置字号
        function setFontSize(size) {
            currentFontSize = size;
            document.getElementById('readerArea').style.fontSize = size + 'px';
            document.querySelector('.paged-content').style.fontSize = size + 'px';
            document.querySelectorAll('.setting-options .setting-option').forEach((el, i) => {
                el.classList.toggle('active', [14, 18, 22, 26][i] === size);
            });
            saveSettings();
            repaginateIfNeeded();
        }
        
        // 设置行距
        function setLineHeight(height) {
            currentLineHeight = height;
            document.getElementById('readerArea').style.lineHeight = height;
            document.querySelector('.paged-content').style.lineHeight = height;
            saveSettings();
            repaginateIfNeeded();
        }

        // 翻页模式下：排版参数变了要重排（异步静默）
        function repaginateIfNeeded() {
            if (readMode !== 'page') return;
            if (typeof paginate !== 'function') return;
            clearTimeout(window.__repagTimer);
            window.__repagTimer = setTimeout(async () => {
                const box = document.getElementById('pagedText');
                if (!box || !chapterBlocks.length) return;
                const keep = currentPage;
                await paginate();
                showPage(Math.min(keep, pageStarts.length - 1));
            }, 120);
        }
        
        // 设置背景色
        function setBgColor(color, night) {
            isNightMode = night;
            document.body.classList.toggle('night-mode', night);
            document.body.style.background = color;
            document.querySelectorAll('.bg-color').forEach((el, i) => {
                el.classList.toggle('active', ['#f5f0e6', '#ffffff', '#c7edcc', '#1a1a1a'][i] === color);
            });
            saveSettings();
        }
        
        // 设置页边距
        function setPadding(padding) {
            currentPadding = padding;
            document.getElementById('readerArea').style.paddingLeft = padding + '%';
            document.getElementById('readerArea').style.paddingRight = padding + '%';
            // 翻页层边距跟随（左右给相同百分比，移动端有媒体查询兜底）
            const pc = document.querySelector('.paged-content');
            if (pc) {
                pc.style.paddingLeft = padding + '%';
                pc.style.paddingRight = padding + '%';
            }
            saveSettings();
            repaginateIfNeeded();
        }
        
        // 保存设置到localStorage
        function saveSettings() {
            const settings = {
                fontSize: currentFontSize,
                lineHeight: currentLineHeight,
                padding: currentPadding,
                nightMode: isNightMode,
                bgColor: document.body.style.background
            };
            localStorage.setItem('novelReaderSettings', JSON.stringify(settings));
        }
        
        // 加载设置
        function loadSettings() {
            try {
                const saved = localStorage.getItem('novelReaderSettings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    if (settings.fontSize) setFontSize(settings.fontSize);
                    if (settings.lineHeight) setLineHeight(settings.lineHeight);
                    if (settings.padding) setPadding(settings.padding);
                    if (settings.nightMode) {
                        isNightMode = true;
                        document.body.classList.add('night-mode');
                    }
                    if (settings.bgColor) {
                        document.body.style.background = settings.bgColor;
                    }
                }
                // ★ 恢复上次的阅读模式（滚动 / 翻页）
                const m = localStorage.getItem('novelReadMode');
                if (m === 'page' || m === 'scroll') readMode = m;
                applyReadMode();
            } catch (e) {
                console.log('加载设置失败:', e.message);
            }
        }
        
        // 切换工具栏显示
        function toggleToolbar() {
            isToolbarVisible = !isToolbarVisible;
            document.getElementById('toolbar').classList.toggle('hidden', !isToolbarVisible);
            document.getElementById('progressBar').classList.toggle('hidden', !isToolbarVisible);
        }
        
        // 键盘控制
        function setupKeyboardControls() {
            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowLeft':
                    case 'a':
                        // 翻页模式：← 翻上一页（到章首再退上一章）
                        if (readMode === 'page' && !e.shiftKey) { e.preventDefault(); pageTurn(-1); break; }
                        if (e.shiftKey) { e.preventDefault(); prevBook(); }
                        else prevChapter();
                        break;
                    case 'ArrowRight':
                    case 'd':
                        if (readMode === 'page' && !e.shiftKey) { e.preventDefault(); pageTurn(1); break; }
                        if (e.shiftKey) { e.preventDefault(); nextBook(); }
                        else nextChapter();
                        break;
                    case 'PageDown':
                        if (readMode === 'page') { e.preventDefault(); pageTurn(1); }
                        break;
                    case 'PageUp':
                        if (readMode === 'page') { e.preventDefault(); pageTurn(-1); }
                        break;
                    case ' ':
                        e.preventDefault();
                        // 翻页模式：空格翻下一页（章末自动续下一章），更接近阅读软件
                        if (readMode === 'page') pageTurn(1, true);
                        else nextChapter();
                        break;
                    case 'ArrowDown':
                        if (readMode === 'page') { e.preventDefault(); nextChapter(); }
                        break;
                    case 'ArrowUp':
                        if (readMode === 'page') { e.preventDefault(); prevChapter(); }
                        break;
                    case 'Escape':
                        if (document.getElementById('catalogSidebar').classList.contains('open') ||
                            document.getElementById('settingsPanel').classList.contains('open')) {
                            closeAllPanels();
                        } else {
                            closeReader();
                        }
                        break;
                    case 'f':
                        toggleToolbar();
                        break;
                }
            });
        }
        
        // 关闭阅读器
        function closeReader() {
            stopReadingTimer();
            saveProgress();
            // 如果是在iframe中，通知父页面关闭
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'closeReader' }, '*');
            } else {
                window.close();
                setTimeout(() => {
                    if (!window.closed) {
                        window.history.back();
                    }
                }, 100);
            }
        }
        
        // 页面关闭时保存进度
        window.addEventListener('beforeunload', () => {
            stopReadingTimer();
            saveProgress();
        });
    </script>
